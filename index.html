<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mega Build — трансформация харитаси (8 йўналиш)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--bg:#F6F7F9;--card:#fff;--ink:#16202B;--mute:#5E6B78;--line:#D9DEE4;--brand:#1F3A5F;

*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.wrap{max-width:1360px;margin:0 auto;padding:22px 20px 36px}
h1{font-size:22px;margin:0 0 4px;font-weight:800}
.sub{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:2px;margin:18px 0 14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{border:none;background:none;padding:10px 12px;font:600 13.5px Inter,sans-serif;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;gap:6px;align-items:center}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.tab .pc{font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px;background:#EEF0F3;color:var(--mute)}
.tab.on .pc{background:var(--brand);color:#fff}
.tab.all{color:var(--ink)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;overflow-x:auto}
.ph{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.ph h2{margin:0;font-size:18px}
.btns{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font:500 12.5px Inter,sans-serif;cursor:pointer;color:var(--ink)}
.btn:hover{background:#EEF0F3}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:9px 13px;min-width:112px;background:#fff}
.kpi b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.kpi span{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.kpi.big b{font-size:28px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#EEF0F3;margin-top:12px;border:1px solid var(--line)}
.bar div{height:100%}
svg.mm{width:100%;min-width:1180px;display:block;margin-top:10px}
.t{cursor:pointer}
.t:hover rect{filter:brightness(.97)}
.dir{cursor:pointer}
.dir:hover>rect:first-child{stroke-width:3}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:12px}
.legend span{display:flex;gap:6px;align-items:center}
.tbl{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px;min-width:900px}
.tbl th{text-align:left;color:var(--mute);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 8px;border-bottom:1px solid #EEF0F3;vertical-align:middle}
.tbl tr.rw{cursor:pointer}.tbl tr.rw:hover{background:#F6F7F9}
.tbl .mini{display:flex;height:9px;border-radius:5px;overflow:hidden;background:#EEF0F3;width:260px}
.tbl .mini div{height:100%}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--line)}
.wrap{position:relative}
.auth{position:absolute;top:22px;right:20px;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--mute)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.pri:hover{background:#2A4C78}
.btn:disabled{opacity:.5;cursor:default}
.dirty{color:var(--late);font-weight:600;font-size:12px}
#lg{position:fixed;inset:0;background:rgba(22,32,43,.45);display:none;align-items:center;justify-content:center;z-index:10}
#lg.on{display:flex}
#lg form{background:#fff;border-radius:12px;padding:22px;width:320px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
#lg h3{margin:0 0 4px;font-size:17px}
#lg input{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:14px Inter,sans-serif}
#lg .err{color:var(--late);font-size:12.5px;min-height:16px}
#lg .row{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}
</style>
</head>

const MAP={bajarildi:'done',jarayonda:'prog',kechikmoqda:'late',rejada:'plan',tasdiqlanmagan:'unc'};
const RMAP=Object.fromEntries(Object.entries(MAP).map(([k,v])=>[v,k]));
const ST={done:'Бажарилди',prog:'Жараёнда',late:'Кечикмоқда',plan:'Режада',unc:'Тасдиқланмаган'};
const ICON={done:'✓',prog:'▶',late:'!',plan:'·',unc:'?'};
const COL={done:'#2E9E5B',prog:'#2F6FD6',late:'#D64545',plan:'#9AA3AE',unc:'#E0A526'};
const COLL={done:'#E3F4EA',prog:'#E4EDFB',late:'#FBE7E7',plan:'#EEF0F3',unc:'#FCF3DC'};
const KEYS=['done','prog','late','unc','plan'];
const CYCLE=['done','prog','late','unc','plan'];
const S={}; // S[dir][id]
let SAVED={}, USER=null; const DIRTY=new Set(); // SAVED — базадаги ҳолатлар, массивдан устун туради
let cur='umumiy';

function load(k){ const m=Object.assign(Object.fromEntries((HOLATLAR[k]||[]).map(([i,s])=>[String(i),s])), SAVED[k]||{}); S[k]={}; DIRTY.delete(k);
  DATA.find(d=>d.k===k).tasks.forEach(([id])=>S[k][id]=MAP[String(m[id]||'rejada').trim().toLowerCase()]||'plan'); }
DATA.forEach(d=>load(d.k));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const cnt=(k,sec)=>{const c={done:0,prog:0,late:0,plan:0,unc:0,n:0};DATA.find(d=>d.k===k).tasks.forEach(([id,s])=>{if(sec==null||s===sec){c[S[k][id]]++;c.n++}});return c};
const allc=()=>{const c={done:0,prog:0,late:0,plan:0,unc:0,n:0};DATA.forEach(d=>{const x=cnt(d.k);KEYS.forEach(k=>c[k]+=x[k]);c.n+=x.n});return c};
const pc=c=>c.n?Math.round(c.done/c.n*100):0;
const segs=c=>KEYS.map(k=>`<div style="width:${c[k]/c.n*100}%;background:${COL[k]}"></div>`).join('');
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.opacity=1;clearTimeout(e._t);e._t=setTimeout(()=>e.style.opacity=0,1500)}
function wrap(t,max){const w=t.split(' '),L=[''];w.forEach(x=>{if((L[L.length-1]+' '+x).trim().length>max&&L[L.length-1])L.push(x);else L[L.length-1]=(L[L.length-1]+' '+x).trim()});return L}
const trunc=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;

}

    KEYS.forEach(k=>{const w=bw*c[k]/c.n; if(w>0) bars+=`<rect x="${sx+off}" y="${y+18}" width="${w}" height="8" fill="${COL[k]}"/>`; off+=w;});
    g+=`<g class="dir" data-k="${d.k}"><rect x="${x-CW/2}" y="${y-CH/2}" width="${CW}" height="${CH}" rx="12" fill="#fff" stroke="#1F3A5F" stroke-width="2"/>
      <text x="${x-CW/2+14}" y="${y-22}" font-size="13.5" font-weight="700" fill="#16202B">${esc(d.nm)}</text>
      <text x="${x+CW/2-14}" y="${y+6}" font-size="26" font-weight="800" text-anchor="end" fill="${p>0?'#2E9E5B':'#16202B'}">${p}%</text>
      <text x="${x-CW/2+14}" y="${y+4}" font-size="11.5" fill="#5E6B78">${c.done}/${c.n} бажарилди</text>
      <clipPath id="cp${i}"><rect x="${sx}" y="${y+18}" width="${bw}" height="8" rx="4"/></clipPath>
      <rect x="${sx}" y="${y+18}" width="${bw}" height="8" rx="4" fill="#EEF0F3"/><g clip-path="url(#cp${i})">${bars}</g>
      <text x="${x-CW/2+14}" y="${y+41}" font-size="11" font-weight="600">`+KEYS.map(k=>`<tspan fill="${COL[k]}">${ICON[k]} ${c[k]}</tspan>`).join('<tspan fill="#C9D0D7">  ·  </tspan>')+`</text></g>`;});
  const p=pc(a),R=96;
  g+=`<circle cx="${cx}" cy="${cy}" r="${R-8}" fill="#1F3A5F"/><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#E3F4EA" stroke-width="9"/>
   <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#2E9E5B" stroke-width="9" stroke-dasharray="${2*Math.PI*R*p/100} 9999" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="${p>0?'round':'butt'}"/>
   <text x="${cx}" y="${cy-22}" text-anchor="middle" fill="#fff" font-size="14" font-weight="800">ТРАНСФОРМАЦИЯ</text>
   <text x="${cx}" y="${cy+16}" text-anchor="middle" fill="#fff" font-size="34" font-weight="800">${p}%</text>
   <text x="${cx}" y="${cy+38}" text-anchor="middle" fill="#fff" font-size="11.5" opacity=".85">${a.done} / ${a.n} вазифа</text>`;
  h+=`<svg class="mm" viewBox="0 0 ${W} ${H}">${ln}${g}</svg>`;
  h+=`<table class="tbl"><thead><tr><th>Йўналиш</th><th>Ҳолатлар</th><th class="n">Бажарилди</th><th class="n">Жараёнда</th><th class="n">Кечикмоқда</th><th class="n">Тасдиқланмаган</th><th class="n">Режада</th><th class="n">Жами</th><th class="n">%</th></tr></thead><tbody>`+
    DATA.map(d=>{const c=cnt(d.k);return `<tr class="rw" data-k="${d.k}"><td><b>${esc(d.nm)}</b></td><td><div class="mini">${segs(c)}</div></td>`+['done','prog','late','unc','plan'].map(k=>`<td class="n">${c[k]}</td>`).join('')+`<td class="n">${c.n}</td><td class="n"><b>${pc(c)}%</b></td></tr>`}).join('')+
    `</tbody><tfoot><tr><td>Жами трансформация</td><td><div class="mini">${segs(a)}</div></td>`+['done','prog','late','unc','plan'].map(k=>`<td class="n">${a[k]}</td>`).join('')+`<td class="n">${a.n}</td><td class="n">${pc(a)}%</td></tr></tfoot></table>`;
  document.getElementById('panel').innerHTML=h;
}

/* ---------- direction mind map ---------- */
function renderDir(k){
  const d=DATA.find(x=>x.k===k), c=cnt(k);
  let h=`<div class="ph"><div><h2>${esc(d.nm)} йўналиши</h2><div class="sub" style="margin-top:3px">${c.n} вазифа · ${USER?'вазифани босинг — ҳолати алмашади, кейин «Сақлаш»ни босинг':'таҳрирлаш учун тизимга киринг'}</div></div>
    <div class="btns">${USER?`${DIRTY.has(k)?'<span class="dirty">● сақланмаган</span>':''}<button class="btn" id="reset" ${DIRTY.has(k)?'':'disabled'}>Бекор қилиш</button><button class="btn pri" id="save" ${DIRTY.has(k)?'':'disabled'}>Сақлаш</button>`:''}</div></div>`+kpiRow(c,'бажарилди');
  const secs=[...new Set(d.tasks.map(t=>t[1]))].sort((a,b)=>a-b);
  const leaves=s=>d.tasks.filter(t=>t[1]===s);
  const total=d.tasks.length; let best=1,bd=1e9,acc=0;
  for(let i=1;i<secs.length;i++){acc+=leaves(secs[i-1]).length; const df=Math.abs(total-2*acc); if(df<bd){bd=df;best=i}}
  const L=secs.slice(0,best),R=secs.slice(best);
  const GAP=40,PAD=40,MINH=96;
  const bh=s=>Math.max(leaves(s).length*GAP,MINH);
  const colH=a=>a.reduce((x,s)=>x+bh(s),0)+PAD*(a.length-1);
  const maxH=Math.max(colH(L),colH(R)), top=30, H=maxH+top*2, W=1300, cx=650, cy=top+maxH/2;
  const PW=330,BW=184;
  let ln='',g='';
  [[L,-1],[R,1]].forEach(([col,side])=>{
    let y=top+(maxH-colH(col))/2;
    const bx=side<0?470:830, px=side<0?20:W-20-PW, ax=side<0?px+PW:px, bedge=bx+side*BW/2;
    col.forEach(s=>{
      const lv=leaves(s), h0=bh(s), by=y+h0/2, sc=cnt(k,s);
      ln+=`<path d="M${cx} ${cy} C${(cx+bx)/2} ${cy},${(cx+bx)/2} ${by},${bx} ${by}" stroke="#1F3A5F" stroke-width="5" fill="none" opacity=".85"/>`;
      const y0=by-(lv.length-1)*GAP/2;
      lv.forEach(([id,,sh,f],i)=>{const st=S[k][id], ly=y0+i*GAP, mx=(bedge+ax)/2;
        ln+=`<path d="M${bedge} ${by} C${mx} ${by},${mx} ${ly},${ax} ${ly}" stroke="${COL[st]}" stroke-width="2.2" fill="none"/>`;
        g+=`<g class="t" data-id="${id}"><title>${esc(id+' '+f)} — ${ST[st]}</title><rect x="${px}" y="${ly-17}" width="${PW}" height="34" rx="17" fill="${COLL[st]}" stroke="${COL[st]}" stroke-width="1.6" ${st==='unc'?'stroke-dasharray="5 3"':''}/>
          <circle cx="${px+17}" cy="${ly}" r="9" fill="${COL[st]}"/><text x="${px+17}" y="${ly+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${ICON[st]}</text>
          <text x="${px+33}" y="${ly+4.5}" font-size="12.3" fill="#16202B"><tspan font-weight="700">${id}</tspan> ${esc(trunc(sh,38))}</text></g>`;});
      const nmL=wrap(d.secs[s]||'',19).slice(0,2), p=sc.n?sc.done/sc.n:0;
      g+=`<g><rect x="${bx-BW/2}" y="${by-36}" width="${BW}" height="72" rx="12" fill="#fff" stroke="#1F3A5F" stroke-width="2.2"/>
        <text x="${bx}" y="${by-17}" text-anchor="middle" font-size="10.5" fill="#5E6B78" font-weight="600">${s}-ЙЎНАЛИШ · ${sc.done}/${sc.n}</text>`+
        nmL.map((t,i)=>`<text x="${bx}" y="${by+1+i*15}" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16202B">${esc(t)}</text>`).join('')+
        `<rect x="${bx-74}" y="${by+25}" width="148" height="4" rx="2" fill="#EEF0F3"/><rect x="${bx-74}" y="${by+25}" width="${148*p}" height="4" rx="2" fill="#2E9E5B"/></g>`;
      y+=h0+PAD;
    });
  });
  const p=pc(c),Rr=78, nm=wrap(d.nm.toUpperCase(),14);
  g+=`<circle cx="${cx}" cy="${cy}" r="${Rr-7}" fill="#1F3A5F"/><circle cx="${cx}" cy="${cy}" r="${Rr}" fill="none" stroke="#E3F4EA" stroke-width="7"/>
    <circle cx="${cx}" cy="${cy}" r="${Rr}" fill="none" stroke="#2E9E5B" stroke-width="7" stroke-dasharray="${2*Math.PI*Rr*p/100} 9999" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="${p>0?'round':'butt'}"/>`+
    nm.map((t,i)=>`<text x="${cx}" y="${cy-20+(i-(nm.length-1))*15}" text-anchor="middle" fill="#fff" font-size="12.5" font-weight="800">${esc(t)}</text>`).join('')+
    `<text x="${cx}" y="${cy+18}" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">${p}%</text>
    <text x="${cx}" y="${cy+38}" text-anchor="middle" fill="#fff" font-size="11" opacity=".85">${c.done} / ${c.n}</text>`;
  h+=`<svg class="mm" viewBox="0 0 ${W} ${H}">${ln}${g}</svg>`;
  document.getElementById('panel').innerHTML=h;
  if(!USER) return;
  document.getElementById('save').onclick=()=>save(k);
  document.getElementById('reset').onclick=()=>{load(k);render();toast('Сақланган ҳолатга қайтарилди')};
}

function render(){ renderTabs(); cur==='umumiy'?renderOverview():renderDir(cur);
  document.getElementById('legend').innerHTML=KEYS.map(k=>`<span><i class="dot" style="background:${COL[k]}"></i>${ST[k]}</span>`).join(''); }
function go(k){ cur=k; try{history.replaceState(null,'','#'+k)}catch(e){} render(); window.scrollTo({top:0}); }
document.addEventListener('click',e=>{
  const tb=e.target.closest('.tab'); if(tb){go(tb.dataset.k);return}
  const dr=e.target.closest('.dir,.rw'); if(dr){go(dr.dataset.k);return}
  const t=e.target.closest('.t'); if(t&&cur!=='umumiy'&&!USER){toast('Таҳрирлаш учун тизимга киринг');return}
  if(t&&cur!=='umumiy'){DIRTY.add(cur);const id=t.dataset.id,s=S[cur][id],i=CYCLE.indexOf(s); S[cur][id]=CYCLE[(i+1)%CYCLE.length]; render(); toast(id+' → '+ST[S[cur][id]]);}
});
const hs=location.hash.slice(1); if(hs==='umumiy'||DATA.some(d=>d.k===hs)) cur=hs;
render();

/* ---------- база ва логин ---------- */
async function api(path,opt={}){
  const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opt});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error||('Хато '+r.status));
  return j;
}
function renderAuth(){
  document.getElementById('auth').innerHTML=USER
    ?`<span>👤 ${esc(USER)}</span><button class="btn" id="lo">Чиқиш</button>`
    :`<button class="btn" id="li">Кириш</button>`;
  const li=document.getElementById('li'), lo=document.getElementById('lo');
  if(li) li.onclick=()=>{document.getElementById('lgerr').textContent='';document.getElementById('lg').classList.add('on');document.querySelector('#lgf input').focus()};
  if(lo) lo.onclick=async()=>{
    if(DIRTY.size&&!confirm('Сақланмаган ўзгаришлар бор. Барибир чиқасизми?'))return;
    await api('/api/logout',{method:'POST'}).catch(()=>{}); USER=null; DATA.forEach(d=>load(d.k)); renderAuth(); render(); toast('Тизимдан чиқдингиз')};
}
async function refresh(){
  try{ const j=await api('/api/state'); SAVED=j.holatlar||{}; USER=j.user||null;
    DATA.forEach(d=>{ if(!DIRTY.has(d.k)) load(d.k) }); render(); }
  catch(e){ console.warn('База:',e.message) }
  renderAuth();
}
async function save(k){
  const b=document.getElementById('save'); if(b){b.disabled=true;b.textContent='Сақланмоқда…'}
  const holatlar=Object.fromEntries(Object.entries(S[k]).map(([id,s])=>[id,RMAP[s]]));
  try{ const j=await api('/api/state',{method:'POST',body:JSON.stringify({dir:k,holatlar})});
    SAVED[k]=holatlar; DIRTY.delete(k); render(); toast('Сақланди ('+j.ozgardi+' та ўзгариш)') }
  catch(e){ if(/кириng|kiring/i.test(e.message)){USER=null;renderAuth()} render(); toast('Сақланмади: '+e.message) }
}
document.getElementById('lgx').onclick=()=>document.getElementById('lg').classList.remove('on');
document.getElementById('lgf').onsubmit=async e=>{
  e.preventDefault(); const f=new FormData(e.target), err=document.getElementById('lgerr'); err.textContent='';
  try{ const j=await api('/api/login',{method:'POST',body:JSON.stringify({login:f.get('login'),password:f.get('password')})});
    USER=j.user; e.target.reset(); document.getElementById('lg').classList.remove('on'); renderAuth(); render(); toast('Хуш келибсиз, '+USER) }
  catch(x){ err.textContent=x.message }
};
window.addEventListener('beforeunload',e=>{ if(DIRTY.size){e.preventDefault();e.returnValue=''} });
refresh();
</script>
